secrets:
  secret_key:
    file: ${SECRETS_DIR}/football_pool_local_flask_secret_key
  db_user:
    file: ${SECRETS_DIR}/football_pool_local_db_user
  db_pass:
    file: ${SECRETS_DIR}/football_pool_local_db_password

services:
  devcontainer:
    build:
      args:
        IMAGE_NAME: ubuntu
        IMAGE_TAG: 24.04
      context: ${GIT_REPOS_DIR}/football-pool
      dockerfile: ./.devcontainer/devcontainer.dockerfile
    volumes:
      - ${GIT_REPOS_DIR}/football-pool:/workspace
    secrets:
      - secret_key
      - db_user
      - db_pass
    depends_on:
      football-pool-db:
        condition: service_healthy

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - football-pool-db

  football-pool-db:
    image: postgres:17
    container_name: football-pool-postgres-local
    hostname: football-pool-postgres-local
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-football-pool}"]
      timeout: 10s
      interval: 5s
      retries: 5
    volumes:
      - football-pool-localdb:/var/lib/postgresql/data:rw
    secrets:
      - db_user
      - db_pass
    environment:
      POSTGRES_DB: football-pool
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_pass
    restart: on-failure:5

volumes:
  football-pool-localdb:
